<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米其林頂級擺盤大師 - Gourmet Plating Master (Ultra-Realistic)</title>
    <!-- Tailwind CSS for UI structure -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for symbols -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Noto Serif TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Cinzel', 'Noto Serif TC', serif;
        }
        
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.8);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.8);
        }

        /* Real photo food drop shadows & outline selection */
        .food-item-node {
            filter: drop-shadow(4px 10px 12px rgba(0,0,0,0.55));
            transition: filter 0.2s ease, transform 0.1s ease;
        }
        .food-item-node.selected {
            filter: drop-shadow(0px 0px 16px rgba(245, 158, 11, 0.95)) drop-shadow(6px 12px 14px rgba(0,0,0,0.6));
        }

        /* High quality tabletop environments */
        .table-bg-slate {
            background: radial-gradient(circle at 50% 50%, #293245 0%, #0f172a 100%);
        }
        .table-bg-wood {
            background-color: #1a0f0a;
            background-image: radial-gradient(#2d1b12 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .table-bg-marble {
            background: radial-gradient(circle at 50% 50%, #334155 0%, #090d16 100%);
        }

        /* Backdrop Glass */
        .glass-panel {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Pulse glow indicator */
        @keyframes subtleGlow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        .animate-glow {
            animation: subtleGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col select-none">

    <!-- Navigation Top Bar -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-3 sticky top-0 z-40 glass-panel flex flex-wrap justify-between items-center shadow-xl">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-tr from-amber-600 to-amber-400 text-slate-950 p-2.5 rounded-2xl shadow-lg shadow-amber-500/20">
                <i class="fa-solid fa-utensils text-xl"></i>
            </div>
            <div>
                <h1 class="serif-font font-bold text-lg md:text-xl text-amber-100 tracking-wide flex items-center gap-2">
                    Gourmet Plating Master <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-sans border border-amber-500/40">寫實米其林版</span>
                </h1>
                <p class="text-xs text-slate-400">極致擬真美食與法式主廚劃盤創作工作室</p>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <button id="btn-sauce-mode" onclick="toggleSauceMode()" class="px-4 py-2 text-xs md:text-sm font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 shadow-md">
                <i class="fa-solid fa-paintbrush text-amber-400"></i>
                <span id="sauce-btn-text">劃盤醬汁模式: 關</span>
            </button>
            <button onclick="clearCanvas()" class="px-3.5 py-2 text-xs md:text-sm font-medium rounded-xl bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i>
                <span>清空</span>
            </button>
            <button onclick="openFinishModal()" class="px-4 py-2 text-xs md:text-sm font-bold rounded-xl bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 hover:from-amber-400 hover:to-amber-300 text-slate-950 shadow-lg shadow-amber-500/20 transition flex items-center gap-2 transform active:scale-95">
                <i class="fa-solid fa-camera"></i>
                <span>擺盤成果 / 評鑑</span>
            </button>
        </div>
    </header>

    <!-- Main Studio Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

        <!-- Left Sidebar: Realistic Food Assets Browser -->
        <aside class="w-full lg:w-96 bg-slate-900/80 border-r border-slate-800 flex flex-col z-20 max-h-[38vh] lg:max-h-none">
            
            <!-- Category Selector Tabs -->
            <div class="flex overflow-x-auto border-b border-slate-800 bg-slate-950/60 p-2 gap-1.5 text-xs font-semibold">
                <button onclick="switchCategory('mains')" id="tab-mains" class="tab-btn px-3.5 py-2 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-drumstick-bite"></i> 主菜 MAINS
                </button>
                <button onclick="switchCategory('sides')" id="tab-sides" class="tab-btn px-3.5 py-2 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800 shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-carrot"></i> 配菜 SIDES
                </button>
                <button onclick="switchCategory('garnishes')" id="tab-garnishes" class="tab-btn px-3.5 py-2 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800 shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-leaf"></i> 點綴 GARNISH
                </button>
                <button onclick="switchCategory('plates')" id="tab-plates" class="tab-btn px-3.5 py-2 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800 shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle"></i> 盤款 PLATES
                </button>
            </div>

            <!-- Asset Grid List -->
            <div class="flex-1 overflow-y-auto p-3">
                <div id="asset-grid" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-3 gap-3">
                    <!-- Assets rendered dynamically -->
                </div>
            </div>

            <!-- Sauce Customization Panel (Shows when Sauce Mode is ACTIVE) -->
            <div id="sauce-panel" class="hidden p-3.5 bg-gradient-to-b from-amber-950/40 to-slate-900 border-t border-amber-500/40 flex flex-col gap-2.5">
                <div class="flex justify-between items-center text-xs text-amber-300 font-bold">
                    <span><i class="fa-solid fa-wand-magic-sparkles mr-1.5"></i> 法式醬汁劃盤工具</span>
                    <button onclick="clearSauces()" class="text-rose-400 hover:text-rose-300 hover:underline text-[11px]">清除醬汁</button>
                </div>

                <!-- Color Options -->
                <div class="flex items-center gap-2">
                    <span class="text-xs text-slate-400">醬汁種類:</span>
                    <div class="flex gap-2 flex-1 overflow-x-auto py-1">
                        <button onclick="setSauceColor('#4a0811')" class="w-7 h-7 rounded-full bg-[#4a0811] border-2 border-amber-400/80 focus:ring-2 ring-amber-300 shrink-0 shadow" title="紅酒波爾多濃醬"></button>
                        <button onclick="setSauceColor('#23531b')" class="w-7 h-7 rounded-full bg-[#23531b] border-2 border-slate-600 focus:ring-2 ring-amber-300 shrink-0 shadow" title="羅勒青油醬"></button>
                        <button onclick="setSauceColor('#ea8c00')" class="w-7 h-7 rounded-full bg-[#ea8c00] border-2 border-slate-600 focus:ring-2 ring-amber-300 shrink-0 shadow" title="百香芒果法式泥"></button>
                        <button onclick="setSauceColor('#121013')" class="w-7 h-7 rounded-full bg-[#121013] border-2 border-slate-600 focus:ring-2 ring-amber-300 shrink-0 shadow" title="巴薩米克香醋濃縮醬"></button>
                        <button onclick="setSauceColor('#be185d')" class="w-7 h-7 rounded-full bg-[#be185d] border-2 border-slate-600 focus:ring-2 ring-amber-300 shrink-0 shadow" title="甜菜根濃縮醬"></button>
                    </div>
                </div>

                <!-- Stroke Size Slider -->
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span>筆觸粗細:</span>
                    <input type="range" id="sauce-size" min="6" max="36" value="14" class="flex-1 accent-amber-500 cursor-pointer">
                </div>
            </div>
        </aside>

        <!-- Center Plating Interactive Canvas Studio -->
        <div id="studio-stage" class="flex-1 relative table-bg-slate flex items-center justify-center p-4 overflow-hidden min-h-[480px]">
            
            <!-- Table Spotlight Lighting overlay -->
            <div class="absolute inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,_transparent_30%,_rgba(0,0,0,0.85)_100%)]"></div>

            <!-- Plating Container -->
            <div id="plating-container" class="relative w-[340px] h-[340px] sm:w-[480px] sm:h-[480px] md:w-[540px] md:h-[540px] flex items-center justify-center transition-all">
                
                <!-- Plate Base Dynamic View -->
                <div id="plate-element" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-all duration-500">
                    <!-- Default White Ceramic Fine Dining Plate -->
                    <div class="w-full h-full rounded-full bg-gradient-to-br from-slate-50 via-slate-100 to-slate-200 shadow-[0_20px_50px_rgba(0,0,0,0.6),_inset_0_4px_25px_rgba(0,0,0,0.12)] border-[14px] border-slate-100/90 flex items-center justify-center">
                        <div class="w-[78%] h-[78%] rounded-full border border-slate-300/70 shadow-[inset_0_3px_12px_rgba(0,0,0,0.08)]"></div>
                    </div>
                </div>

                <!-- Sauce Interactive Drawing Canvas Layer -->
                <!-- Note: z-index will be elevated to 35 dynamically during sauce mode -->
                <canvas id="sauce-canvas" class="absolute inset-0 z-15 pointer-events-none cursor-crosshair"></canvas>

                <!-- Placed Food Layer Container -->
                <div id="food-layer" class="absolute inset-0 z-20 pointer-events-none overflow-hidden">
                    <!-- Placed food nodes inserted via JS -->
                </div>

            </div>

            <!-- Floating Transform Object Controls Toolbar -->
            <div id="item-controls" class="hidden absolute bottom-6 z-40 bg-slate-900/90 border border-slate-700/80 rounded-2xl px-4 py-2.5 shadow-2xl glass-panel flex items-center gap-3 text-xs">
                <span class="text-amber-300 font-semibold border-r border-slate-700 pr-3">編輯食材</span>
                
                <button onclick="rotateSelectedItem(-15)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="逆時針旋轉">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
                <button onclick="rotateSelectedItem(15)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="順時針旋轉">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                
                <div class="h-4 w-px bg-slate-700"></div>

                <button onclick="scaleSelectedItem(0.1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="放大">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <button onclick="scaleSelectedItem(-0.1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="縮小">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>

                <div class="h-4 w-px bg-slate-700"></div>

                <button onclick="changeZIndex(1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="移至上層">
                    <i class="fa-solid fa-layer-group"></i> 上移
                </button>
                <button onclick="changeZIndex(-1)" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition" title="移至下層">
                    <i class="fa-solid fa-layer-group text-slate-500"></i> 下移
                </button>

                <div class="h-4 w-px bg-slate-700"></div>

                <button onclick="deleteSelectedItem()" class="p-2 bg-rose-950/70 hover:bg-rose-900 text-rose-300 rounded-xl transition" title="刪除此食材">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
            </div>

            <!-- Floating Studio Hint Badge -->
            <div id="mode-badge" class="absolute top-4 left-4 bg-slate-900/85 border border-slate-700/80 rounded-xl px-3.5 py-2 text-xs text-slate-200 flex items-center gap-2 pointer-events-none shadow-lg glass-panel">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="mode-badge-text">提示：點擊左側真實食材加入餐盤，按住即可拖拽擺盤</span>
            </div>

        </div>

    </main>

    <!-- Michelin Presentation Photo Studio Modal -->
    <div id="finish-modal" class="hidden fixed inset-0 z-50 bg-slate-950/85 glass-panel flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl relative my-auto">
            
            <button onclick="closeFinishModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center mb-6">
                <div class="inline-flex items-center gap-1.5 text-amber-400 text-xs font-semibold tracking-wider uppercase bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 mb-2">
                    <i class="fa-solid fa-star"></i> Michelin Fine Dining Critique
                </div>
                <h2 class="serif-font text-2xl md:text-3xl font-bold text-amber-100">主廚佳餚美照與米其林評鑑</h2>
                <p class="text-xs text-slate-400 mt-1">請為您的頂級作品命名，並導出一張專屬的米其林美照拍立得</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                
                <!-- Polaroid Frame Display -->
                <div id="polaroid-card" class="bg-slate-950 p-4 rounded-2xl border border-slate-800 shadow-2xl flex flex-col items-center">
                    <div id="snapshot-preview" class="w-full aspect-square bg-slate-900 rounded-xl overflow-hidden relative flex items-center justify-center border border-slate-800 shadow-inner">
                        <!-- Cloned Plate Preview via JS -->
                    </div>
                    <div class="mt-3.5 text-center w-full px-2">
                        <input type="text" id="dish-title-input" value="炙燒熟成黑牛佐松露嫩綠微蔬" class="w-full bg-transparent text-center font-bold text-amber-200 serif-font text-base focus:outline-none border-b border-transparent focus:border-amber-500/50 pb-0.5">
                        <p class="text-[11px] text-slate-500 mt-1 italic">Executive Chef: <span id="chef-signature-display">Chef Alex</span></p>
                    </div>
                </div>

                <!-- Michelin AI Critique Box -->
                <div class="flex flex-col justify-between h-full space-y-4">
                    
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">主廚尊姓大名</label>
                        <input type="text" id="chef-name-input" value="米其林客座主廚" oninput="updateChefSignature()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500/60">
                    </div>

                    <!-- Photo Filter Buttons -->
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1.5">相機美食濾鏡</label>
                        <div class="grid grid-cols-3 gap-1.5 text-xs">
                            <button onclick="setPhotoFilter('normal')" class="py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium">原色 (Natural)</button>
                            <button onclick="setPhotoFilter('warm')" class="py-2 rounded-lg bg-amber-950/50 hover:bg-amber-900/70 text-amber-300 border border-amber-800/50 font-medium">暖色美食</button>
                            <button onclick="setPhotoFilter('dramatic')" class="py-2 rounded-lg bg-indigo-950/50 hover:bg-indigo-900/70 text-indigo-300 border border-indigo-800/50 font-medium">高對比黑奢</button>
                        </div>
                    </div>

                    <!-- Dynamic Critique Box -->
                    <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 space-y-2.5">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-slate-400 font-medium">米其林評委星級：</span>
                            <div id="critique-stars" class="text-amber-400 text-sm flex gap-1">
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                                <i class="fa-solid fa-star"></i>
                            </div>
                        </div>
                        <div class="border-t border-slate-800/80 pt-2">
                            <p id="critique-text" class="text-xs text-slate-300 leading-relaxed italic">
                                "空間留白與食材堆疊極具層次，醬汁劃盤帶有動態美的韻律感，堪稱高級餐飲視覺藝術的典範。"
                            </p>
                        </div>
                    </div>

                    <!-- Modal Actions -->
                    <div class="flex gap-2.5">
                        <button onclick="closeFinishModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">
                            返回微調
                        </button>
                        <button onclick="saveDishCard()" class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 text-xs font-bold transition flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20">
                            <i class="fa-solid fa-check"></i> 完成導出
                        </button>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 border border-amber-500/40 text-amber-200 px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center gap-2.5 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
        <i class="fa-solid fa-circle-check text-amber-400 text-base"></i>
        <span id="toast-message">提示訊息</span>
    </div>

    <script>
        // Global State Variables
        let isSauceMode = false;
        let isDrawingSauce = false;
        let sauceColor = '#4a0811';
        let placedItems = [];
        let selectedItemId = null;
        let currentCategory = 'mains';
        let photoFilter = 'normal';

        let assetGrid, foodLayer, itemControls, plateContainer, sauceCanvas, ctx;

        // High Quality Transparent PNG Cutouts (Vector SVGs) for ultra-realistic plating without background or cropping

            // Mains

            m2: `<svg viewBox="0 0 160 160" width="100%" height="100%">
                <defs>

        const ASSET_LIBRARY = {

                { id: 'p2', name: '微光黑岩天然石板', type: 'plate', bgClass: 'from-zinc-900 via-zinc-800 to-slate-900 border-zinc-700/80', innerBorder: 'border-zinc-700/40', shape: 'rounded-3xl' },
                { id: 'p3', name: '日式粗陶手作深缽', type: 'plate', bgClass: 'from-stone-900 via-amber-950/60 to-stone-900 border-stone-800', innerBorder: 'border-stone-700/50', shape: 'rounded-full' },
                { id: 'p4', name: '皇室精雕金邊白瓷盤', type: 'plate', bgClass: 'from-amber-50 via-slate-100 to-amber-100/80 border-amber-400', innerBorder: 'border-amber-400/50', shape: 'rounded-full' }

        // App Initialization
        function initApp() {
            assetGrid = document.getElementById('asset-grid');
            foodLayer = document.getElementById('food-layer');
            itemControls = document.getElementById('item-controls');
            plateContainer = document.getElementById('plating-container');
            sauceCanvas = document.getElementById('sauce-canvas');
            ctx = sauceCanvas.getContext('2d');

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            switchCategory('mains');
            setupSauceDrawingEvents();
        }

        function resizeCanvas() {
            if (!sauceCanvas || !plateContainer) return;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = sauceCanvas.width;
            tempCanvas.height = sauceCanvas.height;
            const tempCtx = tempCanvas.getContext('2d');
            if (sauceCanvas.width > 0 && sauceCanvas.height > 0) {
                tempCtx.drawImage(sauceCanvas, 0, 0);
            }

            sauceCanvas.width = plateContainer.clientWidth;
            sauceCanvas.height = plateContainer.clientHeight;

            if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, sauceCanvas.width, sauceCanvas.height);
            }
        }

        // Switch Category Tabs
        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn px-3.5 py-2 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800 shrink-0 flex items-center gap-1.5';
            });
            const activeTab = document.getElementById(`tab-${cat}`);
            if (activeTab) {
                activeTab.className = 'tab-btn px-3.5 py-2 rounded-xl bg-amber-500/20 text-amber-300 border border-amber-500/40 shrink-0 flex items-center gap-1.5';
            }
            renderAssetGrid(cat);
        }

        // Render Asset Grid Items
        function renderAssetGrid(category) {
            if (!assetGrid) return;
            assetGrid.innerHTML = '';
            const items = ASSET_LIBRARY[category] || [];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-slate-950/70 border border-slate-800/90 hover:border-amber-500/60 rounded-2xl p-2 flex flex-col items-center justify-between cursor-pointer transition transform hover:-translate-y-0.5 active:scale-95 text-center group';
                
                if (item.type === 'plate') {
                    card.innerHTML = `
                        <div class="w-14 h-14 rounded-full border-2 border-slate-700 flex items-center justify-center my-1 group-hover:border-amber-400 transition bg-slate-900 shadow">
                            <i class="fa-solid fa-circle text-slate-300 text-lg"></i>
                        </div>
                        <span class="text-[11px] font-semibold text-slate-300 mt-1">${item.name}</span>
                    `;
                    card.onclick = () => selectPlate(item);
                } else {
                    const svgMarkup = SVG_FOOD_ITEMS[item.svgId] || '';
                    card.innerHTML = `
                        <div class="w-16 h-16 my-1 flex items-center justify-center filter drop-shadow group-hover:scale-105 transition duration-300">
                            ${svgMarkup}
                        </div>
                        <span class="text-[11px] font-semibold text-slate-300 mt-1 line-clamp-1">${item.name}</span>
                    `;
                    card.onclick = () => addFoodItem(item);
                }
                assetGrid.appendChild(card);
            });
        }

        // Add Food Item onto Plate
        function addFoodItem(itemData) {
            const newItem = {
                id: 'food_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                data: itemData,
                x: plateContainer.offsetWidth / 2 + (Math.random() * 40 - 20),
                y: plateContainer.offsetHeight / 2 + (Math.random() * 40 - 20),
                rotation: 0,
                scale: 1,
                zIndex: placedItems.length + 1
            };
            placedItems.push(newItem);
            renderPlacedItem(newItem);
            selectItem(newItem.id);
            showToast(`已加入：${itemData.name}`);
        }

        // Select Plate
        function selectPlate(plate) {
            const plateEl = document.getElementById('plate-element');
            if (!plateEl) return;
            plateEl.innerHTML = `
                <div class="w-full h-full ${plate.shape} bg-gradient-to-br ${plate.bgClass} shadow-[0_20px_50px_rgba(0,0,0,0.6),_inset_0_4px_25px_rgba(0,0,0,0.12)] border-[14px] flex items-center justify-center">
                    <div class="w-[78%] h-[78%] ${plate.shape} border ${plate.innerBorder} shadow-[inset_0_3px_12px_rgba(0,0,0,0.08)]"></div>
                </div>
            `;
            showToast(`已更換餐盤：${plate.name}`);
        }

        // Render Placed Food Item Node
        function renderPlacedItem(item) {
            const el = document.createElement('div');
            el.id = item.id;
            el.className = 'food-item-node absolute cursor-grab active:cursor-grabbing w-32 h-32 flex items-center justify-center pointer-events-auto';
            el.style.left = `${item.x}px`;
            el.style.top = `${item.y}px`;
            el.style.zIndex = item.zIndex;
            el.style.transform = `translate(-50%, -50%) rotate(${item.rotation}deg) scale(${item.scale})`;

            const svgMarkup = SVG_FOOD_ITEMS[item.data.svgId] || '';
            el.innerHTML = svgMarkup;

            makeElementDraggable(el, item);

            el.onclick = (e) => {
                e.stopPropagation();
                selectItem(item.id);
            };

            foodLayer.appendChild(el);
        }

        // Make Element Draggable (Mouse & Touch compatible)
        function makeElementDraggable(el, itemObj) {
            let isDragging = false;
            let startX, startY;

            const onStart = (e) => {
                if (isSauceMode) return;
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                startX = clientX - itemObj.x;
                startY = clientY - itemObj.y;
                selectItem(itemObj.id);
            };

            const onMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                itemObj.x = clientX - startX;
                itemObj.y = clientY - startY;

                el.style.left = `${itemObj.x}px`;
                el.style.top = `${itemObj.y}px`;
            };

            const onEnd = () => {
                isDragging = false;
            };

            el.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            el.addEventListener('touchstart', onStart, { passive: false });
            window.addEventListener('touchmove', onMove, { passive: false });
            window.addEventListener('touchend', onEnd);
        }

        // Select Active Item
        function selectItem(id) {
            if (isSauceMode) return;
            selectedItemId = id;
            document.querySelectorAll('.food-item-node').forEach(node => {
                node.classList.remove('selected');
            });
            const selectedNode = document.getElementById(id);
            if (selectedNode) {
                selectedNode.classList.add('selected');
                itemControls.classList.remove('hidden');
            }
        }

        // Unselect items when clicking on background stage
        document.getElementById('studio-stage').onclick = (e) => {
            if (e.target.id === 'studio-stage' || e.target.id === 'plating-container') {
                selectedItemId = null;
                document.querySelectorAll('.food-item-node').forEach(node => node.classList.remove('selected'));
                itemControls.classList.add('hidden');
            }
        };

        // Item Transformations Controls
        function rotateSelectedItem(angle) {
            if (!selectedItemId) return;
            const item = placedItems.find(i => i.id === selectedItemId);
            if (item) {
                item.rotation = (item.rotation + angle) % 360;
                updateItemTransform(item);
            }
        }

        function scaleSelectedItem(delta) {
            if (!selectedItemId) return;
            const item = placedItems.find(i => i.id === selectedItemId);
            if (item) {
                item.scale = Math.max(0.4, Math.min(2.5, item.scale + delta));
                updateItemTransform(item);
            }
        }

        function changeZIndex(delta) {
            if (!selectedItemId) return;
            const item = placedItems.find(i => i.id === selectedItemId);
            if (item) {
                item.zIndex = Math.max(1, item.zIndex + delta);
                const el = document.getElementById(item.id);
                if (el) el.style.zIndex = item.zIndex;
            }
        }

        function deleteSelectedItem() {
            if (!selectedItemId) return;
            const el = document.getElementById(selectedItemId);
            if (el) el.remove();
            placedItems = placedItems.filter(i => i.id !== selectedItemId);
            selectedItemId = null;
            itemControls.classList.add('hidden');
            showToast('已移除食材');
        }

        function updateItemTransform(item) {
            const el = document.getElementById(item.id);
            if (el) {
                el.style.transform = `translate(-50%, -50%) rotate(${item.rotation}deg) scale(${item.scale})`;
            }
        }

        // Toggle Sauce Freehand Drawing Mode
        function toggleSauceMode() {
            isSauceMode = !isSauceMode;
            const btn = document.getElementById('btn-sauce-mode');
            const saucePanel = document.getElementById('sauce-panel');
            const badgeText = document.getElementById('mode-badge-text');

            if (isSauceMode) {
                sauceCanvas.style.zIndex = '35';

                badgeText.innerText = '醬汁劃盤開啟：直接在餐盤上點擊或滑動，畫出光滑濃郁的法式醬汁';

            } else {
                sauceCanvas.style.zIndex = '15';

                btn.className = 'px-4 py-2 text-xs md:text-sm font-semibold rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 shadow-md';

                saucePanel.classList.add('hidden');
                badgeText.innerText = '提示：點擊左側真實食材加入餐盤，按住即可拖拽擺盤';
            }
        }

        function setSauceColor(color) {
            sauceColor = color;
            showToast('已切換醬汁顏色');
        }

        // Sauce Canvas Event Handling
        function setupSauceDrawingEvents() {
            const getPos = (e) => {
                const rect = sauceCanvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDraw = (e) => {
                if (!isSauceMode) return;
                isDrawingSauce = true;
                const pos = getPos(e);
                
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.strokeStyle = sauceColor;
                ctx.lineWidth = document.getElementById('sauce-size').value;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 3;

                ctx.arc(pos.x, pos.y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fillStyle = sauceColor;
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            };

            const draw = (e) => {
                if (!isDrawingSauce || !isSauceMode) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            };

            const stopDraw = () => {
                if (isDrawingSauce) {
                    ctx.closePath();
                    isDrawingSauce = false;
                }
            };

            sauceCanvas.addEventListener('mousedown', startDraw);
            sauceCanvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDraw);

            sauceCanvas.addEventListener('touchstart', startDraw, { passive: false });
            sauceCanvas.addEventListener('touchmove', draw, { passive: false });
            window.addEventListener('touchend', stopDraw);
        }

        function clearSauces() {
            ctx.clearRect(0, 0, sauceCanvas.width, sauceCanvas.height);
            showToast('已清空所有劃盤醬汁');
        }

        function clearCanvas() {
            foodLayer.innerHTML = '';
            placedItems = [];
            selectedItemId = null;
            itemControls.classList.add('hidden');
            clearSauces();
            showToast('擺盤已重新開始');
        }

        // Michelin Presentation Modal & Rating System
        function openFinishModal() {
            const modal = document.getElementById('finish-modal');
            const previewContainer = document.getElementById('snapshot-preview');
            
            previewContainer.innerHTML = '';
            const cloneStage = document.getElementById('plating-container').cloneNode(true);
            cloneStage.style.transform = 'scale(0.68)';
            previewContainer.appendChild(cloneStage);

            generateCritique();
            modal.classList.remove('hidden');
        }

        function closeFinishModal() {
            document.getElementById('finish-modal').classList.add('hidden');
        }

        function updateChefSignature() {
            const chefName = document.getElementById('chef-name-input').value || 'Chef Alex';
            document.getElementById('chef-signature-display').innerText = chefName;
        }

        function generateCritique() {
            const count = placedItems.length;
            const starsContainer = document.getElementById('critique-stars');
            const critiqueText = document.getElementById('critique-text');

            let starsHtml = '';
            let comment = '';

            if (count === 0) {
                starsHtml = '<i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>';
                comment = '"餐盤尚為空白，期待主廚加入精選食材展現當代極致烹飪工藝。"';
            } else if (count < 3) {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i><i class="fa-regular fa-star"></i>';
                comment = '"現代極簡留白風格（Negative Space）拿捏得宜，若搭配些許法式醬汁點綴將更富韻律感。"';
            } else if (count < 6) {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i>';
                comment = '"驚豔的三星米其林擺盤！主副食材高低錯落，鮮明對比與醬汁勾勒出優雅的高級餐飲美學！"';
            } else {
                starsHtml = '<i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star"></i>';
                comment = '"色彩極為豐盈熱烈，視覺張力十足，帶有宮廷宴席般華麗豐盛的極致震撼！"';
            }

            starsContainer.innerHTML = starsHtml;
            critiqueText.innerText = comment;
        }

        function setPhotoFilter(mode) {
            photoFilter = mode;
            const preview = document.getElementById('snapshot-preview');
            
            if (mode === 'normal') {
                preview.style.filter = 'none';
            } else if (mode === 'warm') {
                preview.style.filter = 'sepia(0.2) contrast(1.1) saturate(1.3) brightness(1.02)';
            } else if (mode === 'dramatic') {
                preview.style.filter = 'contrast(1.35) saturate(1.2) brightness(0.92)';
            }
            showToast(`已套用相機濾鏡: ${mode.toUpperCase()}`);
        }

        function saveDishCard() {
            showToast('📸 作品拍立得已成功導出儲存！');
            setTimeout(() => {
                closeFinishModal();
            }, 1200);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2200);
        }

        // Initialize application on DOM load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
